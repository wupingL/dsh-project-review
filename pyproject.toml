[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-assistant"
version = "0.1.0"
description = "Versioned project knowledge and local system-level PR reviews"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["PyYAML==6.0.3"]

[project.scripts]
project-assistant = "project_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["project_assistant*"]
