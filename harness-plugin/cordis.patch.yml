# 代码检视 bundle 的装载补丁。
# 行名必须是裸包名，浏览器半身由 package.json 的 dsh.client 绑定到这一行。
- insert:
    - id: recsdk-review
      name: '@local/recsdk-review'
      config:
        # 控制器工程目录默认取 harness-plugin/ 的上一级（即仓库根目录），
        # 一般无需配置；只有控制器放在别处时才取消注释并填写绝对路径。
        # projectRoot: 'D:\path\to\dsh-project-review'
        # 控制器解释器默认 <projectRoot>\.venv\Scripts\python.exe，一般无需配置。
        # python: 'D:\path\to\dsh-project-review\.venv\Scripts\python.exe'
        # 控制器 CLI 单次调用上限（毫秒）。
        cliTimeoutMs: 120000
